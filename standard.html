<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bicchieri Sprint: estrai una nuova combinazione di colori e direzione.">
    <title>Bicchieri Sprint — Gioco standard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <header>
            <h1>Estrattore Carte Ordine Oggetti</h1>
            <p>Estrai una nuova combinazione di direzione e colori.</p>
        </header>

        <section aria-label="Estrazione della carta">
            <button id="estraiCarta" type="button">Estrai Nuova Carta</button>

            <div id="risultato" role="alert" aria-live="polite">
                Clicca sul pulsante per estrarre la combinazione.
            </div>

            <div id="coloriVisuali" class="color-display" aria-label="Sequenza dei colori">
            </div>
        </section>

        <footer>
            <a href="index.html">Torna alla scelta della versione</a>
        </footer>
    </main>

    <script>
        // Array dei colori e delle direzioni disponibili
        const colori = ["Rosso", "Verde", "Blu", "Giallo", "Nero"];
        const direzioni = ["da Sinistra a Destra", "da Destra a Sinistra", "dall'Alto in Basso", "dal Basso in Alto"];

        // Storico delle combinazioni recenti per evitare ripetizioni
        const storicoCombinazioni = [];
        const MAX_STORICO = 5;

        const risultatoDiv = document.getElementById('risultato');
        const coloriVisualiDiv = document.getElementById('coloriVisuali');
        const estraiButton = document.getElementById('estraiCarta');

        function mischiaArray(array) {
            const arrayCopiato = [...array];
            let currentIndex = arrayCopiato.length;

            while (currentIndex !== 0) {
                const randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;

                [arrayCopiato[currentIndex], arrayCopiato[randomIndex]] = [
                    arrayCopiato[randomIndex], arrayCopiato[currentIndex]
                ];
            }

            return arrayCopiato;
        }

        function estraiCarta() {
            let combinazioneValida = false;
            let direzioneCasuale;
            let ordineCasualeColori;
            let combinazioneChiave;

            while (!combinazioneValida) {
                direzioneCasuale = direzioni[Math.floor(Math.random() * direzioni.length)];
                ordineCasualeColori = mischiaArray(colori);
                combinazioneChiave = direzioneCasuale + "|" + ordineCasualeColori.join(',');

                if (!storicoCombinazioni.includes(combinazioneChiave)) {
                    combinazioneValida = true;
                }
            }

            storicoCombinazioni.unshift(combinazioneChiave);
            if (storicoCombinazioni.length > MAX_STORICO) {
                storicoCombinazioni.pop();
            }

            const coloriTesto = ordineCasualeColori.join(', ');
            risultatoDiv.textContent = `${direzioneCasuale}, ${coloriTesto}.`;

            coloriVisualiDiv.innerHTML = '';
            ordineCasualeColori.forEach(colore => {
                const box = document.createElement('div');
                box.className = `color-box ${colore}`;
                box.setAttribute('aria-label', colore);
                box.setAttribute('role', 'img');
                coloriVisualiDiv.appendChild(box);
            });
        }

        estraiButton.addEventListener('click', estraiCarta);
        estraiCarta();
    </script>
</body>
</html>
